name: infra_test
on:
  push:
  # workflow_dispatch:
    # inputs:
    #   environment:
    #     description: select env
    #     required: true
    #     default: dev
    #     type: choice
    #     options:
    #       - dev
    #       - prod
jobs:
  infra_terraform:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v4 

      - name: install terraform
        uses: hashicorp/setup-terraform@v3

      - name: version terraform
        run: terraform version
      
      - name: terraform init
        working-directory: env/dev
        run: terraform init

      - name: terraform plan
        working-directory: env/dev
        run: terraform plan
      
      
